<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cozyGame</title>
    <style>
      @font-face {
        font-family: 'Tiny5';
        src: url('/fonts/Tiny5.ttf') format('truetype');
        font-weight: 100 900;
        font-display: swap;
      }
      html, body { margin: 0; height: 100%; background: #1b1b2a; overflow: hidden; }
      body { font-family: 'Tiny5', monospace; color: #fff; }
      #game { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #ui { position: fixed; inset: 0; pointer-events: none; }
      #ui > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
